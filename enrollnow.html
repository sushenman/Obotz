</head>
<body>
      <div class="header" id="Header">
      <nav class="nav">
        <div class="container">
          <div class="logo">
            <img src="image/Logo.png" alt="" srcset="" />
          </div>
          <div class="navig">
            <ul>
              <li>
                <a href="index.html">Home</a>
              </li>
              <li>
                <a href="about.html">About</a>
              </li>
              <li>
                <a href="program.html">Program</a>

                <a href="#Contact">Gallery</a>

                <a href="contact.html">Contact</a>
              </li>
            </ul>
          </div>
          <div class="btn">
            <a href="enrollnow.html">
              <button class="enroll-btn">
                <span class="icon">🚀</span> Enroll Now
              </button>
            </a>
          </div>
        </div>
      </nav>
    </div>
      <div class="contact-image"></div>
      
      <!-- Franchise Enquiry Form Section -->
      <section class="franchise-enquiry-section">
        <div class="container">
          <div class="lets-chat-header">
            <h1>O'Botz Robotics  <span class="red-text">Enroll Form</span></h1>
          </div>
          
          <form class="lets-chat-form" id="franchiseForm">
            
            
            <!-- Contact Details Section -->
            <div class="form-section-group">
              <h2 class="section-subtitle">Contact Details</h2>
              
              <div class="lets-chat-grid">
                <div class="lets-chat-field">
                  <input type="text" placeholder="First Name" required>
                </div>
                <div class="lets-chat-field">
                  <input type="text" placeholder="Last Name" required>
                </div>
              </div>
              
              <div class="lets-chat-grid">
                <div class="lets-chat-field">
                  <input type="email" placeholder="Email Address" required>
                </div>
                <div class="lets-chat-field">
                  <input type="tel" placeholder="Contact Number" required>
                </div>
              </div>
              
              <div class="lets-chat-grid">
                <div class="lets-chat-field">
                  <input type="text" placeholder="Address" required>
                </div>
               
              </div>
            </div>
            
            <!-- Additional Information Section -->
            <div class="form-section-group">
              <div class="lets-chat-field lets-chat-field-full">
                <input type="text" placeholder="How did you hear about O'Botz?" required>
              </div>
              
            
              
              <div class="lets-chat-field lets-chat-field-full">
                <input type="text" placeholder="Additional comments">
              </div>
            </div>
            
            <!-- Submit Button -->
            <div class="lets-chat-actions">
              <button id="enrollSubmitButton" type="submit" class="lets-chat-submit">Submit</button>
            </div>
            
          </form>
        </div>
      </section>

</body>
</html>
